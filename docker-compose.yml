version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerline-db
    environment:
      POSTGRES_DB: ledgerline_db
      POSTGRES_USER: ledgerline_user
      POSTGRES_PASSWORD: ledgerline_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline_user -d ledgerline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledgerline-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ledgerline_db
      DB_USER: ledgerline_user
      DB_PASSWORD: ledgerline_password
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledgerline-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:

