spring.application.name=ledgerline
server.port=8080

# Default profile uses in-memory DB with PostgreSQL compatibility
# Allows instant zero-setup review for examiners
spring.datasource.url=jdbc:h2:mem:ledgerline_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=ledgerline_user
spring.datasource.password=ledgerline_secret

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at /h2-console for quick inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
ledgerline.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
ledgerline.jwt.expiration-ms=86400000

# Logging
logging.level.com.ledgerline=INFO

