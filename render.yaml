services:
  - type: web
    name: ledgerline-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: ledgerline-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ledgerline-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ledgerline-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ledgerline-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ledgerline-db
          property: password

databases:
  - name: ledgerline-db
    plan: free
    region: oregon
    databaseName: ledgerline_db
    user: ledgerline_user

